<!-- KLHK SUCCESS SECTION -->
<h2 class="page-title">KLHK JSON Encode Logs</h2>
    <p class="page-subtitle">Data yang berhasil dikirim ke server KLHK</p>

    <!-- Filter -->
    <div class="filter-group">
        <div>
            <label>Tanggal Mulai</label>
            <input type="date" id="filter-klhk-from" />
        </div>
        <div>
            <label>Tanggal Akhir</label>
            <input type="date" id="filter-klhk-to" />
        </div>
        <div style="display: flex; gap: 0.5rem;">
            <button class="filter-btn" onclick="filterKLHKData()">
                <i class="bi bi-search"></i> Filter
            </button>
        </div>
    </div>

    <!-- Table -->
    <div class="section">
        <div class="table-container">
            <div class="table-responsive">
                <table class="table" id="klhk-success-table">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Date</th>
                            <th>Data Send</th>
                            <th>Row Send</th>
                            <th>Payload</th>
                            <th>Response</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="klhk-success-body">
                        <tr>
                            <td colspan="7" class="text-center text-muted">
                                <div class="loading">
                                    <div class="loading-spinner"></div>
                                    <p>Memuat data KLHK...</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
